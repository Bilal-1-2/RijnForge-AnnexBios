<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/includes/gegevens-betaalwijze.css">
    <title>gegevens-betaalwijze</title>
</head>

<body>

    <div class="gegevens-betaalwijze-container">
        <h1>STAP 4: VUL JE GEGEVENS IN</h1>

        <input type="text" id="firstname" name="naam" placeholder="Voornaam" required>
        <input type="text" id="surname" name="naam" placeholder="Achternaam*" required><br>

        <input type="email" id="email" name="email" placeholder="E-mailadres" required><br>
        <input type="email" id="email-bevestiging" name="email" placeholder="E-mailadres*" required>

        <h2>STAP 5: KIES JE BETAALWIJZE</h2>


        <div class="custom-radio-checkbox">
            <input type="radio" id="box1" name="checkbox-group">
            <label for="box1"></label>
            <img src="assets/images/Nationalebioslogo.png" alt="Nationalebioslogo" class="nationalebioslogo">


            <input type="radio" id="box2" name="checkbox-group">
            <label for="box2"></label>
            <img src="assets/images/Maestro-logo.png" alt="maetro-logo" class="maestro-logo">


            <input type="radio" id="box3" name="checkbox-group">
            <label for="box3"></label>
            <img src="assets/images/ideal-logo.png" alt="iDEAL-logo" class="ideal-logo">
        </div>



            <div class="terms-checkbox">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms"></label>
                <span class="terms-text">Ik ga akkoord met de <a href="#">algemene voorwaarden</a></span>
            </div>










    </div>



</body>

</html>
